[project]
name = "interpretable_ast"
version = "0.1.0"
description = "Interpretable AST-based depression detection"
requires-python = ">=3.10"
dependencies = [
  "ruff",
  "wandb",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "torchaudio==2.0.2",
  "transformers",
  "pip-tools",
  "pre-commit",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "opensmile",
  "ipykernel",
  "confidence_intervals",
  "seaborn",
  "statsmodels"
]

[project.optional-dependencies]
dev = ["black", "isort", "pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
